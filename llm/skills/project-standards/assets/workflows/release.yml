# Publish the exact distributions validated by the reusable CI workflow.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    name: Publish to PyPI
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing is limited to this job.
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@DOWNLOAD_ARTIFACT_ACTION # DOWNLOAD_ARTIFACT_VERSION
        with:
          name: REPO-distributions
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@PYPI_PUBLISH_ACTION # PYPI_PUBLISH_VERSION
        with:
          packages-dir: dist/
