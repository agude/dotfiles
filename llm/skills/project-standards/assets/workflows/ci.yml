# Callable CI for PACKAGE. It builds and validates one artifact set, then
# matrix-tests the source project. Release publication downloads that set.
name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and type check
    steps:
      - uses: actions/checkout@CHECKOUT_ACTION
      - name: Set up uv
        uses: astral-sh/setup-uv@SETUP_UV_ACTION
      - name: Set up just
        uses: extractions/setup-just@SETUP_JUST_ACTION
      - name: Install workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install -y actionlint
          uv tool install zizmor==ZIZMOR_VERSION
      - name: Install dependencies
        run: just sync
      - name: Lint
        run: just lint
      - name: Type check
        run: just type-check

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: PYTHON_MATRIX
    name: Python ${{ matrix.python-version }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@CHECKOUT_ACTION
      - name: Set up uv
        uses: astral-sh/setup-uv@SETUP_UV_ACTION
      - name: Set up just
        uses: extractions/setup-just@SETUP_JUST_ACTION
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: just sync
      - name: Test
        run: just test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    name: Build and validate distributions
    steps:
      - uses: actions/checkout@CHECKOUT_ACTION
      - name: Set up uv
        uses: astral-sh/setup-uv@SETUP_UV_ACTION
      - name: Set up just
        uses: extractions/setup-just@SETUP_JUST_ACTION
      - name: Install dependencies
        run: just sync
      - name: Validate release tag
        run: bash scripts/validate-release.sh
      - name: Build
        run: just build
      - name: Package check
        run: just package-check dist
      - name: Upload validated distributions
        uses: actions/upload-artifact@UPLOAD_ARTIFACT_ACTION
        with:
          name: PACKAGE-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
