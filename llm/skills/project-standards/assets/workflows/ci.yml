# Callable CI for PACKAGE. It builds and validates one artifact set, then
# matrix-tests the source project. Release publication downloads that set.
name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and type check
    steps:
      - uses: actions/checkout@CHECKOUT_ACTION # CHECKOUT_VERSION
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@SETUP_UV_ACTION # SETUP_UV_VERSION
      - name: Set up just
        uses: extractions/setup-just@SETUP_JUST_ACTION # SETUP_JUST_VERSION
      - name: Install workflow linters
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/vACTIONLINT_VERSION/actionlint_ACTIONLINT_VERSION_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
          uv tool install zizmor==ZIZMOR_VERSION
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Set up Python PYTHON_LATEST
        run: uv python install PYTHON_LATEST
      - name: Install dependencies
        run: just sync
      - name: Lint
        run: just lint
      - name: Type check
        run: just type-check

  test:
    runs-on: ubuntu-latest
    needs: [lint, build]
    strategy:
      fail-fast: false
      matrix:
        python-version: PYTHON_MATRIX
    name: Python ${{ matrix.python-version }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@CHECKOUT_ACTION # CHECKOUT_VERSION
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@SETUP_UV_ACTION # SETUP_UV_VERSION
      - name: Set up just
        uses: extractions/setup-just@SETUP_JUST_ACTION # SETUP_JUST_VERSION
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install "$UV_PYTHON"
      - name: Install dependencies
        run: just sync
      - name: Download validated distributions
        uses: actions/download-artifact@DOWNLOAD_ARTIFACT_ACTION # DOWNLOAD_ARTIFACT_VERSION
        with:
          name: REPO-distributions
          path: dist
      - name: Test
        run: just test
      - name: Check validated distributions
        run: just package-check dist

  build:
    runs-on: ubuntu-latest
    needs: lint
    name: Build and validate distributions
    steps:
      - uses: actions/checkout@CHECKOUT_ACTION # CHECKOUT_VERSION
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@SETUP_UV_ACTION # SETUP_UV_VERSION
      - name: Set up just
        uses: extractions/setup-just@SETUP_JUST_ACTION # SETUP_JUST_VERSION
      - name: Set up Python PYTHON_LATEST
        run: uv python install PYTHON_LATEST
      - name: Install dependencies
        run: just sync
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/validate-release.sh
      - name: Build
        run: just build
      - name: Package check
        run: just package-check dist
      - name: Upload validated distributions
        uses: actions/upload-artifact@UPLOAD_ARTIFACT_ACTION # UPLOAD_ARTIFACT_VERSION
        with:
          name: REPO-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
