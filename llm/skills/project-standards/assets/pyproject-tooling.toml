# Tooling blocks for a Python package's pyproject.toml. Paste and replace
# PACKAGE. Repos without a pyproject.toml put the [tool.ruff] contents in a
# root ruff.toml instead, with the section headers unprefixed ([lint] rather
# than [tool.ruff.lint]).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Version has one home: the package's __init__.py. Nothing else stores it,
# so nothing else can disagree with it.
path = "src/PACKAGE/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/PACKAGE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.16",
    "mypy>=1.15",
]

[tool.ruff]
# Match requires-python.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "RUF",    # Ruff-specific
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by the formatter)
]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=PACKAGE --cov-fail-under=90"
