name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq just shellcheck zsh
      - name: Run static checks
        run: just lint

  tests:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq just tree zsh
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Run tests
        run: just test

  bash-3-2:
    name: Shell Tests on Bash 3.2
    needs: lint
    runs-on: ubuntu-latest
    container: bash:3.2
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: apk add --no-cache bats jq just python3 tree zsh
      - name: Run shell tests
        run: just test-shell

  install:
    name: Install on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y just neovim zsh
      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install just neovim
      - name: Parse installer with macOS system Bash
        if: runner.os == 'macOS'
        run: /bin/bash ./install.sh --dry-run
      - name: Run installation smoke test
        run: just smoke-install
